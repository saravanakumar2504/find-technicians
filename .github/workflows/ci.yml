name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with bundle analysis
        run: npm run build:analyze > build-output.txt 2>&1

      - name: Extract route sizes from build output
        run: node scripts/extract-bundle-stats.js
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Upload bundle report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report-${{ github.sha }}
          path: |
            bundle-stats.json
            .next/analyze/
          retention-days: 7
